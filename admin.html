<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Admin — MT Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='8' fill='%23ff6fb5' stroke='%2317130f' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body class="admin">

<!-- ========== DASHBOARD ========== -->
<div id="dash">
  <header class="top">
    <a class="brand" href="/" aria-label="Back to site">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor"/><g fill="#17130f"><circle cx="10" cy="10" r="4"/><circle cx="22" cy="10" r="4"/><circle cx="10" cy="22" r="4"/><circle cx="22" cy="22" r="4"/></g></svg>
      <span class="brand-word">MT<span>Admin</span></span>
    </a>
    <div class="a-top-actions">
      <button class="a-chip" id="refresh" type="button">Refresh</button>
      <button class="a-chip a-chip-ink" id="export" type="button">Export CSV</button>
    </div>
  </header>

  <main class="a-main">
    <div class="a-head">
      <p class="eyebrow">Pitch inbox</p>
      <h1 class="display">Pitched games</h1>
    </div>

    <div class="a-stats" id="stats"></div>

    <div class="a-tools">
      <div class="a-tabs" id="tabs" role="tablist" aria-label="Filter by status"></div>
      <input class="a-search" id="search" type="search" placeholder="Search name, studio, email, game…" aria-label="Search pitches">
    </div>

    <p class="a-msg" id="msg" role="status"></p>
    <div class="a-list" id="list"></div>
  </main>
</div>

<!-- detail drawer -->
<div class="a-scrim" id="scrim" hidden></div>
<aside class="a-drawer" id="drawer" hidden aria-labelledby="dTitle" role="dialog" aria-modal="true">
  <button class="a-close" id="close" type="button" aria-label="Close">×</button>
  <div id="detail"></div>
</aside>

<script src="admin.js"></script>
</body>
</html>
