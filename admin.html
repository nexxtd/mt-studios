<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Admin — MT Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" type="image/png" href="assets/brand/icon-32.png">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
</head>
<body class="admin">

<!-- ========== LOGIN ========== -->
<main id="login" class="a-login" hidden>
  <form class="form a-login-card" id="loginForm">
    <p class="eyebrow">MT Studios · Admin</p>
    <h1 class="display">Sign in</h1>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="err" id="loginErr" role="alert"></p>
    </div>
    <button class="btn btn-sig" type="submit">Enter <span aria-hidden="true">→</span></button>
  </form>
</main>

<!-- ========== DASHBOARD ========== -->
<div id="dash" hidden>
  <header class="top">
    <a class="brand" href="/" aria-label="Back to site">
      <img class="mark" src="assets/brand/emblem-128.png" width="44" height="44" alt="">
      <span class="brand-word">MT<span>Admin</span></span>
    </a>
    <nav class="a-views" aria-label="Admin sections">
      <a href="#pitches" data-view="pitches">Pitches</a>
      <a href="#games" data-view="games">Games</a>
    </nav>
    <div class="a-top-actions">
      <button class="a-chip" id="refresh" type="button">Refresh</button>
      <button class="a-chip" id="export" type="button">Export CSV</button>
      <button class="a-chip a-chip-ink" id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="a-main" id="gamesView" hidden>
    <div class="a-head">
      <p class="eyebrow">Portfolio</p>
      <h1 class="display">Our games</h1>
      <p class="a-sub">Games the studio owns or has bought. Everything here (except hidden games) shows on the website with live stats from Roblox.</p>
    </div>

    <form class="a-add" id="addForm" autocomplete="off">
      <label for="gInput" class="a-add-label">Add a game</label>
      <div class="a-add-row">
        <input id="gInput" class="a-search" placeholder="Paste a Roblox game link or ID — roblox.com/games/…" required>
        <button class="btn btn-sig" type="submit" id="lookupBtn">Look up <span aria-hidden="true">→</span></button>
      </div>
      <p class="err" id="addErr" role="alert"></p>
    </form>
    <div id="addPreview"></div>

    <div class="a-stats" id="gStats"></div>
    <p class="a-msg" id="gMsg" role="status"></p>
    <div class="a-list" id="gList"></div>
  </main>

  <main class="a-main" id="pitchesView">
    <div class="a-head">
      <p class="eyebrow">Pitch inbox</p>
      <h1 class="display">Pitched games</h1>
    </div>

    <div class="a-stats" id="stats"></div>

    <div class="a-tools">
      <div class="a-tabs" id="tabs" role="tablist" aria-label="Filter by status"></div>
      <input class="a-search" id="search" type="search" placeholder="Search name, studio, email, game…" aria-label="Search pitches">
    </div>

    <p class="a-msg" id="msg" role="status"></p>
    <div class="a-list" id="list"></div>
  </main>
</div>

<!-- detail drawer -->
<div class="a-scrim" id="scrim" hidden></div>
<aside class="a-drawer" id="drawer" hidden aria-labelledby="dTitle" role="dialog" aria-modal="true">
  <button class="a-close" id="close" type="button" aria-label="Close">×</button>
  <div id="detail"></div>
</aside>

<script src="admin.js"></script>
</body>
</html>
